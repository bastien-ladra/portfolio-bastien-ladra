name: Generate public recruiter resumes

on:
  push:
    branches:
      - feat/recruiter-cv-downloads

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Align recruiter metrics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('public/resume.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '<strong>0</strong><b>CVE observée</b><small>release v0.1.18 / Ortelius</small>': '<strong>3</strong><b>expériences pro</b><small>NEHS · GSOI · ASTEK</small>',
              '<strong>0</strong><b>observed CVEs</b><small>release v0.1.18 / Ortelius</small>': '<strong>3</strong><b>professional roles</b><small>NEHS · GSOI · ASTEK</small>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected resume metric not found: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Chrome availability
        run: google-chrome --version

      - name: Generate French and English PDFs
        run: |
          ROOT="file://${GITHUB_WORKSPACE}/public/resume.html"
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf="${GITHUB_WORKSPACE}/public/Bastien_Ladra_CV_Public_FR_2026.pdf" \
            "${ROOT}?lang=fr"
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf="${GITHUB_WORKSPACE}/public/Bastien_Ladra_Resume_Public_EN_2026.pdf" \
            "${ROOT}?lang=en"

      - name: Validate generated PDFs
        run: |
          for pdf in public/Bastien_Ladra_CV_Public_FR_2026.pdf public/Bastien_Ladra_Resume_Public_EN_2026.pdf; do
            test -s "$pdf"
            test "$(head -c 5 "$pdf")" = "%PDF-"
            bytes=$(wc -c < "$pdf")
            if [ "$bytes" -lt 20000 ]; then
              echo "$pdf is unexpectedly small: $bytes bytes"
              exit 1
            fi
          done

      - name: Commit generated recruiter assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/resume.html public/Bastien_Ladra_CV_Public_FR_2026.pdf public/Bastien_Ladra_Resume_Public_EN_2026.pdf
          if git diff --cached --quiet; then
            echo "No generated resume changes to commit"
            exit 0
          fi
          git commit -m "feat: add public recruiter PDF resumes"
          git push
