name: Prune unused router lockfile

on:
  push:
    branches:
      - chore/remove-unused-router-clean

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Remove unused router and refresh lockfile
        run: |
          npm pkg delete dependencies.react-router-dom
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if grep -q '"react-router-dom"' package.json; then
            echo "react-router-dom still present in package.json"
            exit 1
          fi
          if grep -q '"node_modules/react-router-dom"' package-lock.json; then
            echo "react-router-dom still present in package-lock.json"
            exit 1
          fi

      - name: Commit generated dependency cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "chore: remove unused react-router-dom"
          git push
